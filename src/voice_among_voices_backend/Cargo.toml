[package]
name = "voice_among_voices_backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
rapier2d = { version = "0.22.0", features = ["enhanced-determinism"] }
candid = "0.10"
ic-cdk = "0.16.0"
ic-cdk-timers = "0.10.0"                                               # Feel free to remove this dependency if you don't need timers
serde = "^1.0"
futures = "0.3"

# Add this to your Cargo.toml
[profile.release]
codegen-units = 1

# Add this to your Cargo.toml
[profile.dev.package.rapier3d]
opt-level = 3
