[package]
name = "voice_among_voices_backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
rapier2d = { version = "0.26.0", features = ["enhanced-determinism"] }
candid = "0.10.13"
ic-cdk-timers = "0.11.0"
serde = "^1.0"
futures = "0.3"
hound = "3.5.1"
serde_bytes = "0.11.15"
ic-http-certification = "3.0.3"
once_cell = "1.20.2"
ic-stable-structures = "0.6.5"

alloy = { git = "https://github.com/ic-alloy/ic-alloy.git", tag = "v0.3.5-icp.1", default-features = false, features = [
  "icp",
  "sol-types",
  "json",
  "contract",
] }

getrandom = { version = "0.2.15", features = ["custom"] }
serde_cbor = "0.11.2"
regex = "1.11.1"
image = "0.24"
ic-canister-sig-creation = "1.3.0"
ic-certification = "3.0.3"
tiny-skia = "0.11.4"
serde_json = "1.0.140"
ic-cdk = "0.17.2"

[dev-dependencies]
pocket-ic = "9.0.0"
rand = "0.8.5"